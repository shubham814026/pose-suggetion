name: pose_suggestion_app
description: "On-device AI pose-suggestion assistant for photography and selfies."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  camera: ^0.10.5+9
  google_mlkit_pose_detection: ^0.12.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  tflite_flutter: ^0.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/poses/
    - assets/models/
